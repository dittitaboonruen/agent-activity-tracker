name: Legacy Browser QA
on:
  push:
    branches: [feature/legacy-prestige-main-only-qa]
    paths:
      - 'public/illustrations/**'
      - 'tests/legacy-prestige-browser-qa.mjs'
      - '.github/workflows/legacy-prestige-browser-qa.yml'
  pull_request:
    paths:
      - 'public/illustrations/**'
      - 'tests/legacy-prestige-browser-qa.mjs'
      - '.github/workflows/legacy-prestige-browser-qa.yml'
jobs:
  browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start static preview
        run: |
          python3 -m http.server 8787 --directory public > /tmp/legacy-static-server.log 2>&1 &
          sleep 2
      - name: Browser QA: Legacy Table A/B, report and other products
        run: node tests/legacy-prestige-browser-qa.mjs
      - name: Preserve Legacy PDF and preview evidence for manual QA (internal use only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-prestige-internal-visual-qa
          path: /tmp/legacy-prestige-qa/
          if-no-files-found: warn
          retention-days: 3
