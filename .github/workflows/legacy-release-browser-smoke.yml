name: Legacy Release Browser Smoke
on:
  push:
    branches:
      - release/legacy-prestige-public-table-b-20261123
    paths:
      - 'public/illustrations/royal_partners_illustration_tool.html'
      - 'tests/legacy-release-browser-smoke.mjs'
      - '.github/workflows/legacy-release-browser-smoke.yml'
  pull_request:
    branches: [main]
    paths:
      - 'public/illustrations/royal_partners_illustration_tool.html'
      - 'tests/legacy-release-browser-smoke.mjs'
      - '.github/workflows/legacy-release-browser-smoke.yml'
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start isolated static preview
        run: |
          python3 -m http.server 8787 --directory public > /tmp/legacy-release-server.log 2>&1 &
          sleep 2
      - name: Verify Table B, preview zoom, A4 and PDF download
        run: node tests/legacy-release-browser-smoke.mjs
