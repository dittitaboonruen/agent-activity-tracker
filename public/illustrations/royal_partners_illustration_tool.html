<style>
/* =========================================================
   SOFT LUXURY + SMART SUMMARY — PHASE 1
   ปรับเฉพาะ design layer
   ไม่แตะสูตร / ไม่แตะข้อมูล / ไม่แตะ template logic
========================================================= */

:root{
  --rp-bg: #f7f2e8;
  --rp-surface: #fffdf8;
  --rp-surface-2: #fffaf1;
  --rp-card: rgba(255,255,255,0.92);
  --rp-line: rgba(165,129,52,0.18);
  --rp-line-strong: rgba(165,129,52,0.32);

  --rp-navy: #0f233f;
  --rp-navy-2: #162b4a;
  --rp-gold: #c9972b;
  --rp-gold-2: #a97818;
  --rp-text: #2a241f;
  --rp-text-soft: #7a6d5c;

  --rp-shadow-sm: 0 6px 18px rgba(15,35,63,0.06);
  --rp-shadow-md: 0 14px 36px rgba(15,35,63,0.10);
  --rp-shadow-lg: 0 20px 55px rgba(15,35,63,0.12);

  --rp-radius-sm: 12px;
  --rp-radius-md: 18px;
  --rp-radius-lg: 24px;

  --rp-rose: #efe1dc;
  --rp-rose-text: #9b5f52;
}

/* ---------- page ---------- */
html, body{
  background:
    radial-gradient(circle at top left, rgba(201,151,43,0.08), transparent 28%),
    linear-gradient(180deg, #fbf7ef 0%, #f7f2e8 100%);
  color: var(--rp-text);
}

body{
  font-family: Arial, Helvetica, sans-serif;
}

/* ---------- global container feel ---------- */
.panel{
  background: linear-gradient(180deg, rgba(255,253,248,0.98) 0%, rgba(255,249,240,0.96) 100%);
  border: 1px solid var(--rp-line);
  border-radius: var(--rp-radius-lg);
  box-shadow: var(--rp-shadow-md);
  padding: 18px 18px 20px;
  position: relative;
  overflow: hidden;
}

.panel::before{
  content: "";
  position: absolute;
  inset: 0 0 auto 0;
  height: 5px;
  background: linear-gradient(90deg, var(--rp-gold), #e0c27c 45%, var(--rp-gold-2));
  opacity: 0.9;
}

.panel > h2,
.panel > h3{
  color: var(--rp-navy);
  letter-spacing: 0.2px;
}

.panel p{
  color: var(--rp-text-soft);
}

/* ---------- headings ---------- */
h1, h2, h3{
  color: var(--rp-navy);
}

small,
label{
  color: var(--rp-text-soft);
}

/* ---------- field sections ---------- */
.ann-controls,
.ledger-wrap,
.rp-resource-section{
  background: rgba(255,255,255,0.72);
  border: 1px solid var(--rp-line);
  border-radius: var(--rp-radius-md);
  box-shadow: var(--rp-shadow-sm);
}

.ann-controls{
  padding: 16px;
  margin: 14px 0 16px;
}

.ledger-wrap{
  padding: 14px;
  margin-top: 18px;
}

.rp-resource-section{
  padding: 14px;
}

/* ---------- customer / agent rows / generic blocks ---------- */
input,
select,
textarea{
  background: rgba(255,255,255,0.96);
  border: 1px solid rgba(15,35,63,0.10);
  border-radius: 14px;
  color: var(--rp-text);
  padding: 10px 12px;
  transition: all 0.18s ease;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.55);
}

input:focus,
select:focus,
textarea:focus{
  outline: none;
  border-color: rgba(201,151,43,0.65);
  box-shadow:
    0 0 0 4px rgba(201,151,43,0.12),
    inset 0 1px 0 rgba(255,255,255,0.7);
  background: #fffdf9;
}

input::placeholder,
textarea::placeholder{
  color: #b0a38f;
}

/* ---------- buttons ---------- */
button,
input[type="button"],
input[type="submit"]{
  border-radius: 999px !important;
  border: 1px solid rgba(201,151,43,0.45);
  background: linear-gradient(180deg, #fffdf8 0%, #f6eee0 100%);
  color: var(--rp-navy);
  box-shadow: var(--rp-shadow-sm);
  transition: all 0.18s ease;
  font-weight: 600;
}

button:hover,
input[type="button"]:hover,
input[type="submit"]:hover{
  transform: translateY(-1px);
  box-shadow: var(--rp-shadow-md);
  border-color: rgba(201,151,43,0.7);
}

button:active,
input[type="button"]:active,
input[type="submit"]:active{
  transform: translateY(0);
}

/* ---------- try to make tab/product buttons softer ---------- */
button[aria-pressed="true"],
button.active,
button.is-active{
  background: linear-gradient(180deg, #1a3154 0%, #102542 100%);
  color: #fff;
  border-color: rgba(201,151,43,0.85);
  box-shadow:
    0 8px 20px rgba(15,35,63,0.16),
    0 0 0 3px rgba(201,151,43,0.12);
}

/* ---------- inline note / warning ---------- */
.ann-inline-note{
  margin-top: 14px;
  padding: 12px 14px;
  border-radius: 14px;
  background: linear-gradient(180deg, #fff8ef 0%, #fff3df 100%);
  border: 1px solid rgba(201,151,43,0.28);
  color: #725d38;
  line-height: 1.55;
  box-shadow: var(--rp-shadow-sm);
}

.ann-warning{
  margin-top: 14px;
  padding: 12px 14px;
  border-radius: 14px;
  background: linear-gradient(180deg, #fff5f2 0%, #fde8e4 100%);
  border: 1px solid rgba(201,151,43,0.16);
  color: #a05042;
  font-weight: 600;
}

/* ---------- summary cards (generic) ---------- */
.summary-grid,
.summary-cards,
.plan-summary,
.metrics-grid{
  display: grid;
  gap: 14px;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  margin: 16px 0 18px;
}

.summary-grid > div,
.summary-cards > div,
.plan-summary > div,
.metrics-grid > div{
  background: linear-gradient(180deg, rgba(255,255,255,0.95) 0%, rgba(255,249,240,0.92) 100%);
  border: 1px solid var(--rp-line);
  border-radius: 18px;
  padding: 16px 18px;
  box-shadow: var(--rp-shadow-sm);
  position: relative;
  overflow: hidden;
}

.summary-grid > div::before,
.summary-cards > div::before,
.plan-summary > div::before,
.metrics-grid > div::before{
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 4px;
  background: linear-gradient(90deg, rgba(201,151,43,0.9), rgba(224,194,124,0.85));
}

.summary-grid strong,
.summary-cards strong,
.plan-summary strong,
.metrics-grid strong{
  color: var(--rp-navy);
  font-size: 28px;
  line-height: 1.1;
  display: block;
  margin-top: 8px;
}

.summary-grid .highlight,
.summary-cards .highlight,
.plan-summary .highlight,
.metrics-grid .highlight{
  background: linear-gradient(180deg, #fff6f2 0%, #f8ebe7 100%);
  border-color: rgba(201,151,43,0.28);
}

/* ---------- template preview zone ---------- */
.template-preview,
.preview-shell,
.preview-card{
  background: linear-gradient(180deg, rgba(255,255,255,0.96) 0%, rgba(255,251,245,0.94) 100%);
  border: 1px solid var(--rp-line);
  border-radius: 22px;
  box-shadow: var(--rp-shadow-md);
  padding: 18px;
}

.template-preview::before,
.preview-shell::before,
.preview-card::before{
  content: "ตัวอย่างใบสรุป";
  display: inline-block;
  margin-bottom: 14px;
  padding: 8px 14px;
  border-radius: 999px;
  background: linear-gradient(180deg, #fff7e7 0%, #f8ecd2 100%);
  border: 1px solid rgba(201,151,43,0.32);
  color: var(--rp-gold-2);
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.3px;
}

/* ---------- tables ---------- */
table{
  border-collapse: separate;
  border-spacing: 0;
  width: 100%;
  overflow: hidden;
  border-radius: 16px;
}

thead th{
  background: linear-gradient(180deg, var(--rp-navy-2) 0%, var(--rp-navy) 100%);
  color: #fff;
  font-weight: 700;
  border: none;
  padding: 10px 10px;
}

tbody td{
  background: rgba(255,255,255,0.84);
  border-bottom: 1px solid rgba(15,35,63,0.06);
  padding: 10px 10px;
  color: var(--rp-text);
}

tbody tr:nth-child(even) td{
  background: rgba(255,250,242,0.88);
}

tbody tr:hover td{
  background: rgba(249,243,231,0.96);
}

/* ---------- subtle section spacing ---------- */
.panel > * + *{
  margin-top: 14px;
}

/* ---------- responsive ---------- */
@media (max-width: 1024px){
  .summary-grid,
  .summary-cards,
  .plan-summary,
  .metrics-grid{
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 640px){
  .summary-grid,
  .summary-cards,
  .plan-summary,
  .metrics-grid{
    grid-template-columns: 1fr;
  }

  .panel{
    padding: 14px 14px 16px;
    border-radius: 18px;
  }

  input,
  select,
  textarea{
    border-radius: 12px;
  }
}
</style>
